name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest
        env:
          # a deterministic console: Rich renders help panels for the
          # terminal it is given, and a runner has none
          COLUMNS: "200"
          LINES: "50"
          TERM: xterm-256color
      - name: Lint
        run: uv run ruff check .
      - name: The package builds and installs
        run: |
          uv build --out-dir dist
          uv tool install --force dist/*.whl
          toknt --version
          toknt --help > /dev/null
