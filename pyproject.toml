# Project name lives here and in toknt.config.APP_NAME.
# It is intentionally centralized so the working name "toknt" stays easy to change.
[project]
name = "toknt"
version = "0.1.0"
description = "Local-first token, cost and tool analytics for AI coding agents (OpenCode, Codex CLI, Claude Code)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.2",
    # plotext 6.x (Aug 2026) is a fresh API redesign; the stable 5.x API is
    # what this project targets until 6.x settles.
    "plotext>=5.3,<6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
toknt = "toknt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toknt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is built on function calls in argument defaults.
"src/toknt/cli.py" = ["B008"]
