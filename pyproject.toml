# Project name lives here and in toknt.config.APP_NAME.
# It is intentionally centralized so the working name "toknt" stays easy to change.
[project]
name = "toknt"
dynamic = ["version"]
description = "Local-first token, cost and tool analytics for AI coding agents (OpenCode, Codex CLI, Claude Code)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Chen" }]
keywords = [
    "ai",
    "analytics",
    "cli",
    "codex",
    "developer-tools",
    "opencode",
    "tui",
    "tokens",
    "usage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.2",
    # plotext 6.x (Aug 2026) is a fresh API redesign; the stable 5.x API is
    # what this project targets until 6.x settles.
    "plotext>=5.3,<6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/BitPeppr/toknt"
Repository = "https://github.com/BitPeppr/toknt"
Issues = "https://github.com/BitPeppr/toknt/issues"
Changelog = "https://github.com/BitPeppr/toknt/blob/main/CHANGELOG.md"

[project.scripts]
toknt = "toknt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/toknt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/toknt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is built on function calls in argument defaults.
"src/toknt/cli.py" = ["B008"]
